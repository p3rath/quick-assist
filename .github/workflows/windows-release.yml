name: Build Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package Windows portable ZIP
        run: npx electron-builder --win zip -c.win.signAndEditExecutable=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach Windows ZIP to preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 "dist/Quick Assist-0.1.0-win.zip" --clobber --repo "${{ github.repository }}"
