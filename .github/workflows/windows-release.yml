name: Build Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package single Windows portable executable
        shell: bash
        run: npx electron-builder --win portable --publish never -c.win.signAndEditExecutable=false '-c.artifactName=Quick-Assist-${version}-Windows.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach portable executable to preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 "dist/Quick-Assist-0.1.0-Windows.exe" --clobber --repo "${{ github.repository }}"
